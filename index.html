    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Orbs */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.25;
            animation: floatOrb 8s infinite alternate ease-in-out;
        }

        .bg-glow-1 {
            top: -50px;
            left: -50px;
            background: #6366f1;
        }

        .bg-glow-2 {
            bottom: -50px;
            right: -50px;
            background: #ec4899;
            animation-delay: 4s;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: auto;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        /* Profile Section */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .profile-img-container {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.4);
            margin-bottom: 20px;
            animation: pulseGlow 3s infinite alternate;
            position: relative;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #1e293b;
        }

        .profile-name {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .profile-handle {
            font-size: 0.95rem;
            color: #c7d2fe;
            font-weight: 500;
            background: rgba(99, 102, 241, 0.15);
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
        }

        .profile-handle i {
            color: #38bdf8;
            font-size: 0.85rem;
        }

        /* Action Buttons Header */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* Social Links List */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
            transition: 0.5s;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(129, 140, 248, 0.45);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.35);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .social-link i.brand-icon {
            font-size: 1.35rem;
            width: 35px;
            text-align: center;
        }

        /* Platform Brand Colors */
        .social-link.facebook .brand-icon { color: #1877f2; }
        .social-link.instagram .brand-icon { color: #e4405f; }
        .social-link.whatsapp .brand-icon { color: #25d366; }
        .social-link.youtube .brand-icon { color: #ff0000; }
        .social-link.tiktok .brand-icon { color: #00f2fe; }
        .social-link.linkedin .brand-icon { color: #0a66c2; }

        .link-title {
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .link-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-visit {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 8px;
            border-radius: 6px;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .link-arrow {
            color: #64748b;
            font-size: 0.85rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link:hover .link-arrow {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Footer Credit */
        footer {
            margin-top: 35px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            padding: 15px;
            letter-spacing: 0.2px;
            z-index: 1;
        }

        footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Toast Notification */
        .toast {
            visibility: hidden;
            background: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 12px 24px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 40px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            100% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.65); }
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(20px) scale(1.1); }
        }
    </style>
</head>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast">✨ Profile link copied to clipboard!</div>

    <script>
        function copyProfileLink() {
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => { 
                toast.classList.remove("show"); 
            }, 3000);
        }
    </script>
