<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/gif" href="https://vexornull.github.io/favicon/favicon.gif">

    <meta name="description" content="Connect with Tanveer Hussain (vexornull) across all social media platforms including Facebook, Instagram, WhatsApp, YouTube, TikTok, and LinkedIn.">
    <meta name="keywords" content="Tanveer Hussain, vexornull, social media links, links page, Tanveer Hussain portfolio, Facebook, Instagram, YouTube, TikTok, LinkedIn, WhatsApp">

    <!-- Open Graph for Social Sharing -->

    <meta property="og:description" content="Official social media profile directory and links for Tanveer Hussain (@vexornull).">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Connect with Tanveer Hussain (@vexornull) across all official channels.">

    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: auto;
            animation: fadeIn 0.8s ease-out;
        }

        /* Profile Section with Animated Glow */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .profile-img-container {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            margin-bottom: 20px;
            animation: pulseGlow 3s infinite alternate;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #1e293b;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .profile-handle {
            font-size: 0.95rem;
            color: #c7d2fe;
            font-weight: 500;
            background: rgba(99, 102, 241, 0.15);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
        }

        .profile-handle i {
            color: #818cf8;
            font-size: 0.85rem;
        }

        /* Share Button */
        .share-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Social Links List */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 22px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(129, 140, 248, 0.4);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .social-link i.brand-icon {
            font-size: 1.35rem;
            width: 35px;
            text-align: center;
        }

        /* Platform Brand Colors */
        .social-link.facebook .brand-icon { color: #1877f2; }
        .social-link.instagram .brand-icon { color: #e4405f; }
        .social-link.whatsapp .brand-icon { color: #25d366; }
        .social-link.youtube .brand-icon { color: #ff0000; }
        .social-link.tiktok .brand-icon { color: #00f2fe; }
        .social-link.linkedin .brand-icon { color: #0a66c2; }

        .link-title {
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            color: #64748b;
            font-size: 0.85rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link:hover .link-arrow {
            transform: translateX(5px);
            color: #ffffff;
        }

        /* Footer Credit */
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            padding: 15px;
            letter-spacing: 0.2px;
        }

        footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Toast Notification */
        .toast {
            visibility: hidden;
            background: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px 20px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 0.9rem;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            100% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.6); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-card">
            <div class="profile-img-container">
                <img src="https://lh3.googleusercontent.com/d/1ITf_lIgMw0eT00co85vhmKdIJOYjVb_4" alt="Tanveer Hussain">
            </div>
            <h1 class="profile-name">Tanveer Hussain</h1>
            <div class="profile-handle">
                <i class="fa-solid fa-circle-check"></i> @vexornull
            </div>
            
            <!-- Share / Copy Profile Button -->
            <button class="share-btn" onclick="copyProfileLink()">
                <i class="fa-solid fa-share-nodes"></i> Share Profile
            </button>
        </div>

        <!-- Social Media Links -->
        <div class="links-list">
            <a href="https://facebook.com/vexornull" target="_blank" rel="noopener noreferrer" class="social-link facebook">
                <div class="link-content">
                    <i class="fa-brands fa-facebook-f brand-icon"></i>
                    <span class="link-title">Facebook</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://instagram.com/vexornull" target="_blank" rel="noopener noreferrer" class="social-link instagram">
                <div class="link-content">
                    <i class="fa-brands fa-instagram brand-icon"></i>
                    <span class="link-title">Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://wa.me/vexornull" target="_blank" rel="noopener noreferrer" class="social-link whatsapp">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp brand-icon"></i>
                    <span class="link-title">WhatsApp</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://youtube.com/@vexornull" target="_blank" rel="noopener noreferrer" class="social-link youtube">
                <div class="link-content">
                    <i class="fa-brands fa-youtube brand-icon"></i>
                    <span class="link-title">YouTube</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://tiktok.com/@vexornull" target="_blank" rel="noopener noreferrer" class="social-link tiktok">
                <div class="link-content">
                    <i class="fa-brands fa-tiktok brand-icon"></i>
                    <span class="link-title">TikTok</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://linkedin.com/in/vexornull" target="_blank" rel="noopener noreferrer" class="social-link linkedin">
                <div class="link-content">
                    <i class="fa-brands fa-linkedin-in brand-icon"></i>
                    <span class="link-title">LinkedIn</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
        </div>
    </div>

    <!-- Footer Credit -->
    <footer>
        Created by <a href="https://tanveer-web.blogspot.com/" target="_blank" rel="noopener noreferrer">Tanveer Hussain</a>
    </footer>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast">Link copied to clipboard! ✨</div>

    <script>
        function copyProfileLink() {
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById("toast");
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }
    </script>

</body>
</html>
