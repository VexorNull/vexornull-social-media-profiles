<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/gif" href="https://vexornull.github.io/favicon/favicon.gif">
    
    <!-- Complete SEO & Open Graph Meta Tags -->
    <title>Tanveer Hussain (@vexornull) - Cyber Social Hub & Portfolio</title>
    <meta name="description" content="Connect with Tanveer Hussain (vexornull) across all official social media platforms, channels, and developer networks.">
    <meta name="keywords" content="Tanveer Hussain, vexornull, social links, portfolio, Facebook, Instagram, YouTube, TikTok, LinkedIn, WhatsApp">
    <meta name="author" content="Tanveer Hussain">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Tanveer Hussain (@vexornull) - Cyber Social Hub">
    <meta property="og:description" content="Official social media profile directory and digital hub for Tanveer Hussain (@vexornull).">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/1ITf_lIgMw0eT00co85vhmKdIJOYjVb_4">
    <meta property="og:url" content="https://tanveer-web.blogspot.com/">
    <meta property="og:type" content="profile">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tanveer Hussain (@vexornull) - Cyber Social Hub">
    <meta name="twitter:description" content="Connect with Tanveer Hussain (@vexornull) across all official channels.">
    <meta name="twitter:image" content="https://lh3.googleusercontent.com/d/1ITf_lIgMw0eT00co85vhmKdIJOYjVb_4">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Ultra-Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-glow-1: #6366f1;
            --accent-glow-2: #ec4899;
            --card-bg: rgba(13, 17, 28, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --hover-border: rgba(129, 140, 248, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #02040a;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Dynamic Mesh Background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 15%, var(--accent-glow-1) 0%, transparent 50%),
                radial-gradient(circle at 90% 85%, var(--accent-glow-2) 0%, transparent 50%);
            opacity: 0.15;
            z-index: -2;
            transition: background-image 0.5s ease;
        }

        /* Ambient Glowing Aura Orbs */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(110px);
            z-index: -1;
            opacity: 0.25;
            animation: driftOrb 10s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        .glow-1 { top: -100px; left: -100px; background: var(--accent-glow-1); }
        .glow-2 { bottom: -100px; right: -100px; background: var(--accent-glow-2); animation-delay: 5s; }

        .container {
            width: 100%;
            max-width: 530px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: auto;
            z-index: 1;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Profile Header Component */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-glow-1), #a855f7, var(--accent-glow-2));
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.45);
            margin-bottom: 18px;
            animation: pulseGlow 3s infinite alternate;
            position: relative;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #07090f;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 500;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: blink 2s infinite;
        }

        .profile-name {
            font-family: 'Outfit', sans-serif;
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .profile-handle {
            font-size: 0.9rem;
            color: #c7d2fe;
            font-weight: 500;
            background: rgba(99, 102, 241, 0.12);
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
        }

        .profile-handle i {
            color: #38bdf8;
            font-size: 0.8rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-bottom: 18px;
        }

        .btn-action {
            flex: 1;
            max-width: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(12px);
        }

        .btn-action:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #ffffff;
            border-color: var(--hover-border);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        /* Live Search Bar */
        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px 12px 42px;
            border-radius: 14px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .search-box input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.25);
            background: rgba(17, 24, 39, 0.9);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Social Links List */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .social-link::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .social-link:hover::after {
            transform: translateX(100%);
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(22, 30, 48, 0.95);
            border-color: var(--hover-border);
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.35);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .social-link i.brand-icon {
            font-size: 1.35rem;
            width: 35px;
            text-align: center;
        }

        /* Platform Brand Colors */
        .social-link.facebook .brand-icon { color: #1877f2; }
        .social-link.instagram .brand-icon { color: #e4405f; }
        .social-link.whatsapp .brand-icon { color: #25d366; }
        .social-link.youtube .brand-icon { color: #ff0000; }
        .social-link.tiktok .brand-icon { color: #00f2fe; }
        .social-link.linkedin .brand-icon { color: #0a66c2; }

        .link-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .link-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-action {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 8px;
            border-radius: 6px;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .link-arrow {
            color: #64748b;
            font-size: 0.8rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link:hover .link-arrow {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Footer Credit */
        footer {
            margin-top: 35px;
            text-align: center;
            font-size: 0.82rem;
            color: #9ca3af;
            padding: 15px;
            letter-spacing: 0.2px;
            z-index: 1;
        }

        footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Toast Alert Notification */
        .toast {
            visibility: hidden;
            background: #0d111c;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 12px 24px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 0.88rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 40px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.35); }
            100% { box-shadow: 0 0 45px rgba(168, 85, 247, 0.65); }
        }

        @keyframes driftOrb {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(25px) scale(1.12); }
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Ambient Glow Background Elements -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <!-- Profile Header Component -->
        <div class="profile-card">
            <div class="profile-img-container">
                <img src="https://lh3.googleusercontent.com/d/1ITf_lIgMw0eT00co85vhmKdIJOYjVb_4" alt="Tanveer Hussain">
            </div>
            
            <div class="status-badge">
                <span class="status-dot"></span> Online & Verified Hub
            </div>

            <h1 class="profile-name">Tanveer Hussain</h1>
            
            <div class="profile-handle">
                <i class="fa-solid fa-circle-check"></i> @vexornull
            </div>
            
            <!-- Quick Action Buttons -->
            <div class="action-buttons">
                <button class="btn-action" onclick="copyProfileLink()">
                    <i class="fa-solid fa-share-nodes"></i> Share Hub
                </button>
                <button class="btn-action" onclick="switchTheme()">
                    <i class="fa-solid fa-palette"></i> Theme
                </button>
            </div>
        </div>

        <!-- Real-time Link Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search platforms..." onkeyup="filterLinks()">
        </div>

        <!-- Social Media Links Directory -->
        <div class="links-list" id="linksList">
            <a href="https://facebook.com/vexornull" target="_blank" rel="noopener noreferrer" class="social-link facebook" data-name="facebook">
                <div class="link-content">
                    <i class="fa-brands fa-facebook-f brand-icon"></i>
                    <span class="link-title">Facebook</span>
                </div>
                <div class="link-right">
                    <span class="badge-action">Connect</span>
                    <i class="fa-solid fa-chevron-right link-arrow"></i>
                </div>
            </a>

            <a href="https://instagram.com/vexornull" target="_blank" rel="noopener noreferrer" class="social-link instagram" data-name="instagram">
                <div class="link-content">
                    <i class="fa-brands fa-instagram brand-icon"></i>
                    <span class="link-title">Instagram</span>
                </div>
                <div class="link-right">
                    <span class="badge-action">Follow</span>
                    <i class="fa-solid fa-chevron-right link-arrow"></i>
                </div>
            </a>

            <a href="https://wa.me/vexornull" target="_blank" rel="noopener noreferrer" class="social-link whatsapp" data-name="whatsapp">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp brand-icon"></i>
                    <span class="link-title">WhatsApp</span>
                </div>
                <div class="link-right">
                    <span class="badge-action">Chat</span>
                    <i class="fa-solid fa-chevron-right link-arrow"></i>
                </div>
            </a>

            <a href="https://youtube.com/@vexornull" target="_blank" rel="noopener noreferrer" class="social-link youtube" data-name="youtube">
                <div class="link-content">
                    <i class="fa-brands fa-youtube brand-icon"></i>
                    <span class="link-title">YouTube</span>
                </div>
                <div class="link-right">
                    <span class="badge-action">Subscribe</span>
                    <i class="fa-solid fa-chevron-right link-arrow"></i>
                </div>
            </a>

            <a href="https://tiktok.com/@vexornull" target="_blank" rel="noopener noreferrer" class="social-link tiktok" data-name="tiktok">
                <div class="link-content">
                    <i class="fa-brands fa-tiktok brand-icon"></i>
                    <span class="link-title">TikTok</span>
                </div>
                <div class="link-right">
                    <span class="badge-action">Watch</span>
                    <i class="fa-solid fa-chevron-right link-arrow"></i>
                </div>
            </a>

            <a href="https://linkedin.com/in/vexornull" target="_blank" rel="noopener noreferrer" class="social-link linkedin" data-name="linkedin">
                <div class="link-content">
                    <i class="fa-brands fa-linkedin-in brand-icon"></i>
                    <span class="link-title">LinkedIn</span>
                </div>
                <div class="link-right">
                    <span class="badge-action">Network</span>
                    <i class="fa-solid fa-chevron-right link-arrow"></i>
                </div>
            </a>
        </div>
    </div>

    <!-- Footer Credit -->
    <footer>
        Created by <a href="https://tanveer-web.blogspot.com/" target="_blank" rel="noopener noreferrer">Tanveer Hussain</a>
    </footer>

    <!-- Toast Notification Message -->
    <div id="toast" class="toast">✨ Profile link copied to clipboard successfully!</div>

    <script>
        // Copy Profile Link Script
        function copyProfileLink() {
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => { 
                toast.classList.remove("show"); 
            }, 3000);
        }

        // Live Search / Filter Script
        function filterLinks() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let links = document.getElementById('linksList').getElementsByClassName('social-link');

            for (let i = 0; i < links.length; i++) {
                let name = links[i].getAttribute('data-name');
                if (name.includes(input)) {
                    links[i].style.display = "flex";
                } else {
                    links[i].style.display = "none";
                }
            }
        }

        // Dynamic Accent Theme Switcher
        const themes = [
            { c1: '#6366f1', c2: '#ec4899' },
            { c1: '#3b82f6', c2: '#10b981' },
            { c1: '#8b5cf6', c2: '#f43f5e' },
            { c1: '#f59e0b', c2: '#ef4444' }
        ];
        let currentTheme = 0;

        function switchTheme() {
            currentTheme = (currentTheme + 1) % themes.length;
            let t = themes[currentTheme];
            document.documentElement.style.setProperty('--accent-glow-1', t.c1);
            document.documentElement.style.setProperty('--accent-glow-2', t.c2);
        }
    </script>

</body>
</html>
